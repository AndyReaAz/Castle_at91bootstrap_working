name: NextGen AT91Bootstrap build

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ro-root-image-slots
    paths:
      - build-fast.sh
      - configs/nextgen_*_uboot_defconfig
      - driver/**
      - include/**
      - main.c
      - .github/workflows/nextgen-build.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Run NOR trailer regression
        run: python3 tests/test-nextgen-uboot-trailer.py

      - name: Build SD and NOR profiles
        run: |
          set -euo pipefail
          mkdir -p output
          for profile in sd nor; do
            ./build-fast.sh rebuild "$profile" 2>&1 | tee "at91-$profile.log"
            cp "build-$profile/binaries/boot.bin" "output/at91-$profile.bin"
          done
          (cd output && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: nextgen-at91bootstrap-${{ github.sha }}
          path: |
            output/
            at91-sd.log
            at91-nor.log
          if-no-files-found: error
          retention-days: 14
